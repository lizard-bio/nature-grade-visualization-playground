[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "font-rhd"
version = "0.1.3"
authors = [
  { name = "BioLizard", email = "contact@lizard.bio"},
  { name = "Aniko Meijer", email = "aniko.meijer@lizard.bio"},
  { name = "Artuur Couckuyt", email = "artuur.couckuyt@lizard.bio"},
  { name = "Robbe Neirynck" }
]
maintainers = [
  { name = "Alexander Koch", email = "alexander.koch@lizard.bio"},
  { name = "Aniko Meijer", email = "aniko.meijer@lizard.bio"},
  { name = "Artuur Couckuyt", email = "artuur.couckuyt@lizard.bio"}
]
description = "Red Hat Display font repackaged for the Python Fonts module"
readme = "README.md"
changelog_file = "CHANGELOG.md" 
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Fonts",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "numpy>=2.2.4",
]

[project.urls]
"Homepage" = "https://github.com/lizard-bio/nature-grade-visualization-playground/tree/main"

[project.entry-points.fonts_ttf]
rhd = "font_rhd:font_files"

[tool.hatch.build.targets.wheel]
packages = ["font_rhd"]